name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sır taraması
        run: npm run secrets:scan
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Migrasyon yukarı, aşağı, yukarı
        run: npm run migrate:check
        env:
          LOCAL_DB_DIR: ${{ runner.temp }}/migrate-check-db
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Uçtan uca test raporu (başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sonuclari
          path: test-results/
          retention-days: 7
      - name: Bağımlılık denetimi (çalışma zamanı)
        run: npm audit --omit=dev --audit-level=high
